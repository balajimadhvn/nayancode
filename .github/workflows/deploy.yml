# Test, build and publish the Workbench to GitHub Pages on every push to main (free for public repositories).
name: Test and deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Benchmark vs DESeq2, limma-voom and edgeR (committed public data)
        run: npm run bench -- benchmarks/deseq2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { GH_PAGES: '1' }
      - name: Build for the GitHub Pages sub-path
        run: npm run build
        env: { BASE_PATH: /nayancode/ }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  # Benchmarks that need downloads (10x PBMC3k, E. coli reads) or long runs: single-cell vs Scanpy, variant calling vs
  # native bcftools, phylogenetics vs IQ-TREE. Reference outputs are committed, so no R, Python or IQ-TREE is needed here.
  # They report but do not block a deploy.
  extended-benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache@v4
        with: { path: benchmarks/.cache, key: "bench-data-${{ hashFiles('benchmarks/fetch.sh') }}-v2" }
      - run: npm ci
      - run: bash benchmarks/fetch.sh
      - run: npm run bench -- benchmarks/scanpy benchmarks/bcftools benchmarks/iqtree
      - uses: actions/upload-artifact@v4
        with: { name: benchmark-results, path: benchmarks/results/ }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
